name: CI/CD Coffee Shop

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/coffee-shop:latest

  deploy-to-k3s:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Copiar manifestos K8s para o Master
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.MASTER_IP }}
          username: suporte
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "k8s/"
          target: "/home/suporte/"

      - name: Aplicar deploy no cluster
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.MASTER_IP }}
          username: suporte
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo k3s kubectl apply -f /home/suporte/k8s/
            sudo k3s kubectl rollout restart deployment coffee-shop